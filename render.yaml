services:
  - type: web
    name: document-qa-service
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && bash build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma
    disk:
      mountPath: /data/chroma
      sizeGB: 1
